plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups('com.geckolib')
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

base {
    archivesName = mod_id
}

// The two-client launcher can override the address, or disable quick-play with -PdevAutoConnect=false.
def devAutoConnect = (project.findProperty('devAutoConnect') ?: 'true').toString().toBoolean()
def devServerAddress = project.findProperty('devServerAddress') ?: '127.0.0.1:26000'
def gameTestSelection = project.findProperty('gameTestSelection')

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientA {
            client()
            gameDirectory = project.file('run/client-a')
            programArguments.addAll '--username', 'EchoTesterA'
            if (devAutoConnect) {
                programArguments.addAll '--quickPlayMultiplayer', devServerAddress
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientB {
            client()
            gameDirectory = project.file('run/client-b')
            programArguments.addAll '--username', 'EchoTesterB'
            if (devAutoConnect) {
                programArguments.addAll '--quickPlayMultiplayer', devServerAddress
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (gameTestSelection) {
                programArguments.addAll '--tests', gameTestSelection.toString()
            }
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // INFO keeps local launches usable; DEBUG floods Easy NPC and can push
            // dedicated-server startup past the two-client launcher timeout.
            logLevel = org.slf4j.event.Level.INFO

            // Avoid long stalls on Mojang auth endpoints when offline-mode is used.
            systemProperty 'java.net.preferIPv4Stack', 'true'
            systemProperty 'sun.net.client.defaultConnectTimeout', '5000'
            systemProperty 'sun.net.client.defaultReadTimeout', '5000'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Lets the IDE/compiler see GeckoLib's injected interfaces (GeoEntity, etc.)
    interfaceInjectionData "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Easy NPC Core is a required gameplay dependency, but it is not shaded into
    // this jar. Config UI remains a local authoring/playtest convenience.
    compileOnly "maven.modrinth:easy-npc-core:${easy_npc_version}"
    localRuntime "maven.modrinth:easy-npc-core:${easy_npc_version}"
    localRuntime "maven.modrinth:easy-npc-config-ui:${easy_npc_version}"

    // Packet Fixer is NeoForge-native and safe on dedicated server + clients.
    // Axiom + Sinytra Connector must NOT be on the shared classpath: Connector's
    // Fabric mixin/SLF4J stack crashes runServer with NoSuchMethodError Logger.atLevel.
    // Those jars are installed only into run/client-*/mods via tools/sync-dev-runtime-mods.ps1.
    localRuntime files('libs/dev-runtime/packetfixer-neoforge-3.3.4-26.1.jar')

    // Client recipe browser for local playtests; not published with the mod.
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            geckolib_version       : geckolib_version,
            easy_npc_version       : easy_npc_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

/**
 * Fails early when JEI's declared NeoForge floor is above {@code neo_version}.
 * Prevents the "Mod jei requires neoforge X or above" client boot error.
 */
tasks.register('verifyJeiNeoForgeCompatibility') {
    group = 'verification'
    description = 'Ensures neo_version satisfies the JEI NeoForge versionRange.'
    def localRuntimeConfig = configurations.localRuntime
    def neoVersionValue = neo_version.toString()
    def jeiVersionValue = jei_version.toString()
    def minecraftVersionValue = minecraft_version.toString()
    def compareVersions = { String left, String right ->
        def normalize = { String raw ->
            raw.replaceAll(/-beta$/, '').tokenize('.').collect { part ->
                part.isInteger() ? part.toInteger() : 0
            }
        }
        def a = normalize(left)
        def b = normalize(right)
        def size = Math.max(a.size(), b.size())
        for (int i = 0; i < size; i++) {
            int av = i < a.size() ? a[i] : 0
            int bv = i < b.size() ? b[i] : 0
            if (av != bv) {
                return av <=> bv
            }
        }
        return 0
    }
    inputs.files(localRuntimeConfig)
    inputs.property('neoVersion', neoVersionValue)
    inputs.property('jeiVersion', jeiVersionValue)
    inputs.property('minecraftVersion', minecraftVersionValue)
    doLast {
        def prefix = "jei-${minecraftVersionValue}-neoforge-"
        def jeiJar = localRuntimeConfig.files.find { file ->
            file.name.startsWith(prefix) && file.name.endsWith('.jar')
        }
        if (jeiJar == null) {
            throw new GradleException("JEI jar not found on localRuntime; check jei_version=${jeiVersionValue}")
        }
        def toml = new java.util.zip.ZipFile(jeiJar).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/neoforge.mods.toml')
            if (entry == null) {
                throw new GradleException("JEI jar missing META-INF/neoforge.mods.toml: ${jeiJar.name}")
            }
            zip.getInputStream(entry).getText('UTF-8')
        }
        def matcher = (toml =~ /(?s)modId\s*=\s*"neoforge".*?versionRange\s*=\s*"([^"]+)"/)
        if (!matcher.find()) {
            throw new GradleException("Could not parse JEI NeoForge versionRange from ${jeiJar.name}")
        }
        def range = matcher.group(1)
        def lower = (range =~ /\[\s*([^,\]]+)/)
        if (!lower.find()) {
            throw new GradleException("Unsupported JEI NeoForge range '${range}' in ${jeiJar.name}")
        }
        def required = lower.group(1).trim()
        if (compareVersions(neoVersionValue, required) < 0) {
            throw new GradleException(
                    "JEI ${jeiVersionValue} requires NeoForge ${range}, but neo_version is ${neoVersionValue}. " +
                    "Raise neo_version to at least ${required} (or pin an older jei_version).")
        }
        logger.lifecycle("JEI ${jeiVersionValue} NeoForge range ${range} OK with neo_version=${neoVersionValue}")
    }
}

tasks.named('check').configure { dependsOn('verifyJeiNeoForgeCompatibility') }
tasks.matching { it.name ==~ /run(Client|Server|GameTestServer|Data).*/ || it.name.startsWith('prepare') }.configureEach {
    dependsOn('verifyJeiNeoForgeCompatibility')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
